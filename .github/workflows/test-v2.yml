name: Actions test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

env:
  version: ${{ github.sha }}
  environment: production
  application_name: "actions-consumer"
  provider_application_name: "actions-provider"
  broker_url: https://testdemo.pactflow.io

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x]
        action: [
            can-i-deploy,
            create-version-tag,
            publish-pact-files,
            # publish-provider-contract,
            delete-branch,
            record-deployment,
            record-release,
            create-or-update-version,
          ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js 18.x for ${{ matrix.action }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: ${{ matrix.action }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.action }}
      - run: npm run test:unit
        name: test ${{ matrix.action }}
        working-directory: ${{ matrix.action }}

  pact-publish-oas-action:
    # needs: test
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      # MANDATORY: Must use 'checkout' first
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish provider contract on passing test run
        if: success()
        uses: ./publish-provider-contract
        with:
          application_name: ${{ env.provider_application_name }}
          contract: test/products.yml
          verification_results: test/report.md
          verification_exit_code: 0
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw
      - name: Publish provider contract on failing test run
        # ensure we publish results even if the tests fail
        if: failure()
        uses: ./publish-provider-contract
        with:
          application_name: ${{ env.provider_application_name }}
          contract: test/products.yml
          verification_results: test/report.md
          verification_exit_code: 1
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw

  pact-can-i-deploy-provider:
    needs: pact-publish-oas-action
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./can-i-deploy
        with:
          to_environment: ${{ env.environment }}
          application_name: ${{ env.provider_application_name }}
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw

  pact-record-deployment-provider:
    needs: pact-can-i-deploy-provider
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./record-deployment
        with:
          environment: ${{ env.environment }}
          application_name: ${{ env.provider_application_name }}
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw

  publish-pact-files:
    needs: pact-record-deployment-provider
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      # MANDATORY: Must use 'checkout' first
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./publish-pact-files
        with:
          pactfiles: test/pact.json
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw

  pact-can-i-deploy-consumer:
    needs: publish-pact-files
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./can-i-deploy
        with:
          application_name: ${{ env.application_name }}
          to_environment: ${{ env.environment }}
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw

  pact-record-deployment-consumer:
    needs: pact-can-i-deploy-consumer
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./record-deployment
        with:
          application_name: ${{ env.application_name }}
          environment: ${{ env.environment }}
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw

  pact-record-release-consumer:
    needs: pact-can-i-deploy-consumer
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./record-release
        with:
          application_name: ${{ env.application_name }}
          environment: ${{ env.environment }}
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw

  pact-create-version-tag:
    needs: pact-record-deployment-consumer
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./create-version-tag
        with:
          application_name: ${{ env.application_name }}
          tag: ${{ env.environment }}
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw


  pact-create-or-update-version:
    needs: pact-record-deployment-consumer
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./create-or-update-version
        with:
          application_name: ${{ env.application_name }}
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw
  pact-delete-branch:
    needs: pact-record-deployment-consumer
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./delete-branch
        if: github.event_name == 'push'
        with:
          application_name: ${{ env.application_name }}
          broker_url: ${{ env.broker_url }}
          token: 129cCdfCWhMzcC9pFwb4bw
          branch: ${{ github.ref_name }}
          error_when_not_found: "true"

  commit-lint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install committed
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: committed

      # checkout does not leave the base branch as a local ref, so fetch it
      # before asking committed for a range against it.
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Check commit messages
        run: committed FETCH_HEAD..HEAD

  release-script:
    name: Check release script
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install git-cliff and typos
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: git-cliff,typos

      - name: Shellcheck
        run: shellcheck scripts/release

      - name: Dry-run prepare
        run: scripts/release prepare --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  complete:
    name: Test completion check
    if: always()
    runs-on: ubuntu-latest

    needs:
      - test
      - pact-publish-oas-action
      - pact-can-i-deploy-provider
      - pact-record-deployment-provider
      - publish-pact-files
      - pact-can-i-deploy-consumer
      - pact-record-deployment-consumer
      - pact-record-release-consumer
      - pact-create-version-tag
      - pact-create-or-update-version
      - pact-delete-branch
      - commit-lint
      - release-script

    steps:
      - name: Failed
        run: exit 1
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')

