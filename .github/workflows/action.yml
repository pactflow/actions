name: Test pact CLI action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_cli_action:
    strategy:
      matrix:
        os: [ubuntu-latest,windows-latest,macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft != true
    name: test pact cli action
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: pact-cli
        uses: ./
      - name: pact-broker on bash
        run: pact-broker help
        if: runner.os != 'windows'
        shell: bash
      - name: pact-broker on sh
        run: pact-broker help
        if: runner.os != 'windows'
        shell: sh
      - name: pact-broker.bat on cmd
        run: pact-broker.bat help
        if: runner.os == 'windows'
        shell: cmd
      - name: pact-broker.bat on sh
        run: pact-broker.bat help
        if: runner.os == 'windows'
        shell: sh
      - name: pact-broker.bat on bash
        run: pact-broker.bat help
        if: runner.os == 'windows'
        shell: bash
      - name: pact-broker.bat on powershell
        run: pact-broker.bat help
        if: runner.os == 'windows'
        shell: powershell
      - name: pact-broker.bat on pwsh
        run: pact-broker.bat help
        if: runner.os == 'windows'
        shell: pwsh

  complete:
    name: CLI action completion check
    if: always()
    runs-on: ubuntu-latest

    needs:
      - test_cli_action

    steps:
      # A draft PR skips every guarded job, which would otherwise leave the
      # gate green; report red until the PR is marked ready for review.
      - name: Failed
        run: exit 1
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || github.event.pull_request.draft == true
