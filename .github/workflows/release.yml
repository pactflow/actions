---
name: release

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_COLOR: '1'
  CLICOLOR: '1'

jobs:
  prepare:
    name: Update release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.PACTFLOW_CI_BOT_APP_ID }}
          private-key: ${{ secrets.PACTFLOW_CI_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install git-cliff and typos
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c  # v2.85.9
        with:
          tool: git-cliff,typos

      - name: Update release PR
        run: scripts/release prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  tag:
    name: Create release tag
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'release/actions'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.PACTFLOW_CI_BOT_APP_ID }}
          private-key: ${{ secrets.PACTFLOW_CI_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Pushed with the app token, not GITHUB_TOKEN: a tag pushed with
      # GITHUB_TOKEN does not trigger the publish job below.
      - name: Create and push release tag
        run: scripts/release tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # `gh release create` fails if the release exists, so re-running this job
      # after a partial failure edits the existing release instead.
      - name: Create GitHub release
        run: |
          scripts/release notes "${GITHUB_REF_NAME#v}" > release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
